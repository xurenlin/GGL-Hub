version: '3.8' # Docker Compose 文件版本，3.8 兼容性好，支持大多数现代功能

services:
  # =================================================================
  # 1. 核心基础设施 (MySQL & Nacos)
  # =================================================================

  mysql:
    image: mysql:8.0 # 使用 MySQL 8.0 官方镜像
    container_name: ggl-mysql # 容器在 Docker 里的显示名称
    environment:
      # 环境变量配置
      - MYSQL_ROOT_PASSWORD=123456 # 设置数据库 root 用户的密码
      - MYSQL_DATABASE=nacos # 启动时自动创建一个名为 nacos 的数据库
      - TZ=Asia/Shanghai # 设置容器时区为上海，保证日志时间正确
    ports:
      - "3307:3306" # 端口映射：[宿主机端口]:[容器内端口]。你用 3307 访问，它转发到容器的 3306
    volumes:
      # 数据持久化挂载
      - ./volumes/mysql_data:/var/lib/mysql # 将数据库文件存到宿主机，防止容器删了数据丢失
      - ./init-scripts:/docker-entrypoint-initdb.d # 自动执行该目录下的 .sql 脚本进行初始化
    command:
      # 启动指令补充
      - --character-set-server=utf8mb4 # 设置服务器字符集为 utf8mb4（支持表情符号）
      - --collation-server=utf8mb4_unicode_ci # 设置排序规则
      - --default-authentication-plugin=mysql_native_password # 兼容旧版客户端的登录方式
    networks:
      - ggl-network # 加入自定义网络，方便容器间通过名字互相访问
    healthcheck:
      # 健康检查：确保 MySQL 真正启动成功，而不只是进程存在
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ] # 运行 ping 指令测试
      interval: 10s # 每 10 秒检查一次
      retries: 5 # 连续失败 5 次认为不健康
    restart: unless-stopped # 除非手动停止，否则挂了总是自动重启

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: ggl-nacos
    environment:
      - MODE=standalone # 运行模式：standalone 为单机版，cluster 为集群版
      - SPRING_DATASOURCE_PLATFORM=mysql # 告诉 Nacos 使用 MySQL 作为持久化存储
      - MYSQL_SERVICE_HOST=mysql # MySQL 的主机名，直接写上面定义的容器名 mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - NACOS_AUTH_ENABLE=true # 开启鉴权功能（登录需要用户名密码）
      # 下面是 Nacos 2.x 必需的密钥配置（长度必须大于 32 位）
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=server.identity
      - NACOS_AUTH_IDENTITY_VALUE=ggl-nacos-server
    ports:
      - "8848:8848" # Nacos 控制台端口
      - "9848:9848" # Nacos 2.x 客户端 gRPC 注册端口（必须开放）
    volumes:
      - ./volumes/nacos/logs:/home/nacos/logs
    networks:
      - ggl-network
    depends_on:
      # 依赖顺序控制
      mysql:
        condition: service_healthy # 必须等 mysql 健康检查通过后，再启动 nacos
    restart: unless-stopped

  # =================================================================
  # 2. AI 向量数据库 (Milvus 体系)
  # =================================================================

  etcd:
    # Milvus 的元数据管理中心（类似 Nacos 对微服务的作用）
    container_name: ggl-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=5 # 自动压缩历史记录，防止磁盘占满
    command: etcd -advertise-client-urls http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - ggl-network

  minio:
    # 对象存储（存文件，也存 Milvus 的向量索引数据）
    image: minio/minio:latest
    container_name: ggl-minio
    ports:
      - "9002:9000" # API 服务端口
      - "9003:9001" # 管理后台端口
    environment:
      - MINIO_ROOT_USER=minioadmin # 默认账号
      - MINIO_ROOT_PASSWORD=minioadmin # 默认密码
    volumes:
      - ./volumes/minio_data:/data
    command: server /data --console-address ":9001" # 启动服务端并开启后台
    networks:
      - ggl-network

  milvus:
    # 核心向量引擎
    container_name: ggl-milvus-standalone
    image: milvusdb/milvus:v2.3.15
    command: [ "milvus", "run", "standalone" ] # 以单机模式运行
    environment:
      - ETCD_ENDPOINTS=etcd:2379 # 告诉 milvus 去哪找 etcd
      - MINIO_ADDRESS=minio:9000 # 告诉 milvus 去哪找 minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "19530:19530" # Java SDK (gRPC) 连接此端口进行向量检索
    depends_on:
      - etcd
      - minio
    networks:
      - ggl-network

  attu:
    # Milvus 的可视化管理界面
    container_name: ggl-milvus-attu
    image: zilliz/attu:latest
    environment:
      - MILVUS_URL=milvus:19530 # 默认连接地址
    ports:
      - "8000:3000" # 浏览器访问 http://localhost:8000
    networks:
      - ggl-network

  # =================================================================
  # 3. 运维与可观测性 (Redis & ELK & Monitoring)
  # =================================================================

  redis:
    image: redis:7.0-alpine
    container_name: ggl-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass 123456 # 开启 AOF 持久化并设置密码
    networks:
      - ggl-network

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: ggl-elasticsearch
    environment:
      - discovery.type=single-node # 单节点模式运行，不组建集群
      - xpack.security.enabled=false # 学习环境关闭安全限制，方便连接
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 限制 JVM 内存，防止撑爆电脑
    ports:
      - "9200:9200"
    networks:
      - ggl-network

  jaeger:
    # 分布式链路追踪：看你的 AI Agent 调微服务到底卡在哪一环
    image: jaegertracing/all-in-one:latest
    container_name: ggl-jaeger
    ports:
      - "16686:16686" # UI 界面：http://localhost:16686
    networks:
      - ggl-network

# =================================================================
# 网络与存储卷定义
# =================================================================

networks:
  ggl-network:
    # 定义一个桥接网络
    driver: bridge
    name: ggl-network # 这样所有容器都可以通过“服务名”互相 ping 通

volumes:
  # 命名卷定义，让 Docker 自动管理磁盘空间
  mysql_data:
  minio_data:
